on:
  push:
    branches: main
  pull_request:
    branches: main

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Evaluate release checks
        run: |
          nix eval --accept-flake-config ".#checks.$(nix eval --impure --raw --expr 'builtins.currentSystem')" \
            --apply 'builtins.mapAttrs (_: d: d.drvPath)'

      # Evaluating the flake requires building the grammar-prefetch JSON first;
      # --no-build forbids that, so evaluation fails.
      - name: Clippy and test
        run: nix -L build .#debug-checks --accept-flake-config

  nix-client-app:
    runs-on: ubuntu-latest
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Build client-app example
        run: nix build .#debug-client-app -L --accept-flake-config

  topiary-cli:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Build dev shell
        run: |
            nix build ".#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').debug-shell" \
                --out-link .nix-develop-cache --accept-flake-config

      - name: Build the topiary-cli and run impure integration tests/`kind(test)`
        shell: 'nix develop .#debug-shell --profile .nix-develop-cache --accept-flake-config --command bash -e {0}'
        run: cargo nextest run -p topiary-cli --features experimental --filterset 'kind(test)' --retries 2


  test-windows:
    # Note: GitHub's Windows runners have a Rust toolchain installed
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Prefetch grammars
        run: cargo run --all-features -- prefetch

      - name: Run test suite
        run: cargo test --all-features
