on:
  push:
    branches: main
  pull_request:
    branches: main

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings


jobs:

  nix-flake-check:
    runs-on: ubuntu-latest
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
      CARGO_PROFILE: "dev"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Fetch flake inputs
        run: nix -L flake check --no-build --impure --accept-flake-config

      - name: Clippy, test, and benchmark
        run: nix -L flake check --impure --accept-flake-config

  nix-client-app:
    runs-on: ubuntu-latest
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
      CARGO_PROFILE: "dev"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Build client-app example
        run: nix build .#client-app -L --impure --accept-flake-config

  topiary-cli:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Disable Nix garbage collection so that anything fetched in one step is
      # not collected before a later step builds it.
      GC_DONT_GC: 1
      CARGO_PROFILE: "dev"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/nix-build
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          auth_token: "${{ secrets.CACHIX_TWEAG_TOPIARY_AUTH_TOKEN }}"

      - name: Build the topiary-cli and test those tests that cannot be performed in Nix
        run: nix develop --impure --command bash -c "cargo run --all-features -- prefetch && cargo test -p topiary-cli --features experimental"

      - name: Test topiary-core compiles without default features
        run: nix develop --command bash -c "cargo test -p topiary-core --no-default-features"

  test-windows:
    # Note: GitHub's Windows runners have a Rust toolchain installed
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Prefetch grammars
        run: cargo run --all-features -- prefetch

      - name: Run test suite
        run: cargo test --all-features
